aid: newsblur
name: NewsBlur
description: >-
  NewsBlur is a personal news reader that brings people together to talk about the
  world. It is an RSS/Atom feed aggregator with training-based intelligence (hide or
  highlight stories per feed), original-site and original-text views, saved (starred)
  stories, folders, OPML import/export, and a social layer of shareable "blurblogs"
  with following, comments and likes. NewsBlur is open source (MIT, github.com/samuelclay/NewsBlur),
  runs native iOS, macOS and Android apps, and exposes a documented HTTP API plus an
  official hosted Model Context Protocol (MCP) server at newsblur.com/mcp for AI agents.
  This profile captures NewsBlur's public API surface for the API Evangelist network.
